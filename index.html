<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MindAR Cable Test</title>

    <script type="importmap">
    {
        "imports": {
            "three":
            "https://unpkg.com/three@0.160.0/build/three.module.js",

            "three/addons/":
            "https://unpkg.com/three@0.160.0/examples/jsm/",

            "mindar-image-three":
            "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <style>

        body {
            margin: 0;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #control {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
        }

    </style>

</head>


<body>

    <div id="control">

        <button id="startButton">
            START
        </button>

        <button id="stopButton">
            STOP
        </button>

    </div>


    <div id="container"></div>

    <script type="module">

        import * as THREE from "three";

        import {
            MindARThree
        } from "mindar-image-three";


        // ==================================================
        // MindAR setup
        // ==================================================

        const mindarThree =
            new MindARThree({

                container:
                    document.querySelector(
                        "#container"
                    ),

                imageTargetSrc:
                    "./targets/cable-end-a.mind"

            });


        const {
            renderer,
            scene,
            camera
        } = mindarThree;


        const anchor =
            mindarThree.addAnchor(0);


        // ==================================================
        // Lighting
        // ==================================================

        const hemisphereLight =
            new THREE.HemisphereLight(
                0xffffff,
                0x444444,
                2.5
            );

        scene.add(
            hemisphereLight
        );


        const directionalLight =
            new THREE.DirectionalLight(
                0xffffff,
                2.5
            );

        directionalLight.position.set(
            -2,
            3,
            4
        );

        scene.add(
            directionalLight
        );


        // ==================================================
        // Cable group
        // ==================================================

        const cableGroup =
            new THREE.Group();


        // ==================================================
        // Horizontal cylinder helper
        // ==================================================

        function createHorizontalCylinder(
            radius,
            length,
            color,
            xPosition,
            openEnded = false,
            metalness = 0
        ) {

            const geometry =
                new THREE.CylinderGeometry(
                    radius,
                    radius,
                    length,
                    32,
                    1,
                    openEnded
                );


            const material =
                new THREE.MeshStandardMaterial({

                    color: color,

                    roughness: 0.65,

                    metalness: metalness

                });


            const mesh =
                new THREE.Mesh(
                    geometry,
                    material
                );


            mesh.rotation.z =
                Math.PI / 2;


            mesh.position.x =
                xPosition;


            return mesh;
        }


        // ==================================================
        // Outer black sheath
        // ==================================================

        const outerJacket =
            createHorizontalCylinder(
                0.095,
                0.48,
                0x111111,
                0.18,
                true
            );

        cableGroup.add(
            outerJacket
        );


        // ==================================================
        // Inner bedding
        // ==================================================

        const bedding =
            createHorizontalCylinder(
                0.067,
                0.64,
                0xd9c9a3,
                0.10,
                true
            );

        cableGroup.add(
            bedding
        );


        // ==================================================
        // Steel wire armour
        // ==================================================

        const ARMOUR_WIRES =
            24;

        const armourRadius =
            0.079;


        for (
            let i = 0;
            i < ARMOUR_WIRES;
            i++
        ) {

            const angle =
                (
                    i /
                    ARMOUR_WIRES
                )
                *
                Math.PI
                *
                2;


            const armourWire =
                createHorizontalCylinder(
                    0.005,
                    0.56,
                    0x888888,
                    0.14,
                    false,
                    0.85
                );


            armourWire.position.y =
                Math.cos(angle)
                *
                armourRadius;


            armourWire.position.z =
                Math.sin(angle)
                *
                armourRadius;


            cableGroup.add(
                armourWire
            );

        }


        // ==================================================
        // Four cores
        // ==================================================

        const corePositions = [

            {
                color: 0xcc2222,
                y: 0.030,
                z: 0.030
            },

            {
                color: 0xe0c000,
                y: 0.030,
                z: -0.030
            },

            {
                color: 0x2255cc,
                y: -0.030,
                z: 0.030
            },

            {
                color: 0x222222,
                y: -0.030,
                z: -0.030
            }

        ];


        for (
            const core of corePositions
        ) {

            // Insulation

            const insulation =
                createHorizontalCylinder(
                    0.018,
                    0.88,
                    core.color,
                    -0.02
                );


            insulation.position.y =
                core.y;


            insulation.position.z =
                core.z;


            cableGroup.add(
                insulation
            );


            // Exposed copper

            const copper =
                createHorizontalCylinder(
                    0.010,
                    0.10,
                    0xb87333,
                    -0.51,
                    false,
                    0.8
                );


            copper.position.y =
                core.y;


            copper.position.z =
                core.z;


            cableGroup.add(
                copper
            );

        }


        // ==================================================
        // Position cable relative to tracking sheet
        // ==================================================

        cableGroup.position.set(
            0,
            0,
            0.12
        );


        // Slight angle so the cable does not look completely flat

        cableGroup.rotation.z =
            -0.10;


        // Attach cable to tracking paper

        anchor.group.add(
            cableGroup
        );


        // ==================================================
        // Tracking feedback
        // ==================================================

        anchor.onTargetFound =
            () => {

                console.log(
                    "Cable End A detected"
                );

            };


        anchor.onTargetLost =
            () => {

                console.log(
                    "Cable End A lost"
                );

            };


        // ==================================================
        // Start AR
        // ==================================================

        const start =
            async () => {

                console.log(
                    "Starting MindAR"
                );


                try {

                    await mindarThree.start();


                    console.log(
                        "MindAR started"
                    );


                    renderer.setAnimationLoop(
                        () => {

                            renderer.render(
                                scene,
                                camera
                            );

                        }
                    );

                }

                catch (error) {

                    console.error(
                        "MindAR start failed:",
                        error
                    );

                }

            };


        document
            .querySelector(
                "#startButton"
            )
            .addEventListener(
                "click",
                start
            );


        document
            .querySelector(
                "#stopButton"
            )
            .addEventListener(
                "click",
                () => {

                    mindarThree.stop();


                    renderer.setAnimationLoop(
                        null
                    );

                }
            );

    </script>


</body>

</html>
