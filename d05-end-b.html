<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-05 Cable End B</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
        #container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

        #topControl {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            max-width: calc(100% - 20px);
            background: rgba(0,0,0,0.82);
            color: white;
            padding: 10px;
            border-radius: 10px;
        }

        #setLabel { font-weight: bold; margin-bottom: 5px; }
        #status { margin-top: 6px; font-size: 13px; }
        #startButton { padding: 10px 15px; font-weight: bold; }

        #meterPanel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 20px);
            max-width: 480px;
            z-index: 5;
            background: rgba(0,0,0,0.86);
            color: white;
            padding: 12px;
            border-radius: 12px;
        }

        #meterTitle { font-weight: bold; margin-bottom: 8px; }

        #meterDisplay {
            background: #b7caa5;
            color: #111;
            border: 4px solid #333;
            border-radius: 7px;
            padding: 12px;
            margin-bottom: 10px;
            text-align: right;
            font-family: "Courier New", monospace;
            font-size: 34px;
            font-weight: bold;
        }

        .row { display: flex; gap: 6px; margin-bottom: 8px; }

        .row button {
            flex: 1;
            padding: 11px 5px;
            border: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .measured { opacity: 0.55; }

        #recordPanel {
            background: rgba(255,255,255,0.10);
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        #finishButton {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #289b42;
            color: white;
            font-weight: bold;
        }

        #restartButton {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: none;
            border-radius: 8px;
            background: #666;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div id="container">

    <div id="topControl">
        <div id="setLabel">Cable Set</div>

        <button id="startButton">
            START AR
        </button>

        <div id="status">
            Ready
        </div>
    </div>

    <div id="meterPanel">
        <div id="meterTitle">
            DIGITAL MULTIMETER — Ω
        </div>

        <div id="meterDisplay">
            ----
        </div>

        <div class="row">
            <button class="measureButton" data-core="0">MEASURE CORE 1</button>
            <button class="measureButton" data-core="1">MEASURE CORE 2</button>
            <button class="measureButton" data-core="2">MEASURE CORE 3</button>
        </div>

        <div id="recordPanel">
            Core 1: Not measured<br>
            Core 2: Not measured<br>
            Core 3: Not measured
        </div>

        <button id="finishButton">
            COMPLETE MEASUREMENT
        </button>

        <button id="restartButton">
            RETURN TO END A
        </button>
    </div>
</div>

<script type="module">
import * as THREE from "three";

import {
    MindARThree
} from "mindar-image-three";

import {
    CABLE_SETS,
    getCableSetFromUrl,
    getStorageKey
} from "./cable-config.js";

const cableSet =
    getCableSetFromUrl();

const cableConfig =
    CABLE_SETS[
        cableSet
    ];

const storageKey =
    getStorageKey(
        cableSet
    );

const storedSession =
    localStorage.getItem(
        storageKey
    );

let session =
    storedSession
    ?
    JSON.parse(
        storedSession
    )
    :
    null;

const container =
    document.querySelector(
        "#container"
    );

const startButton =
    document.querySelector(
        "#startButton"
    );

const statusText =
    document.querySelector(
        "#status"
    );

const setLabel =
    document.querySelector(
        "#setLabel"
    );

const meterDisplay =
    document.querySelector(
        "#meterDisplay"
    );

const recordPanel =
    document.querySelector(
        "#recordPanel"
    );

const measureButtons =
    document.querySelectorAll(
        ".measureButton"
    );

const finishButton =
    document.querySelector(
        "#finishButton"
    );

const restartButton =
    document.querySelector(
        "#restartButton"
    );

setLabel.textContent =
    cableConfig.label
    +
    " — END B";

if (
    !session ||
    !session.endACompleted
) {
    statusText.textContent =
        "Complete this cable's End A first";

    startButton.disabled =
        true;

    measureButtons.forEach(
        button => {
            button.disabled =
                true;
        }
    );
}

const readings = [
    null,
    null,
    null
];

function createHorizontalCylinder(
    radius,
    length,
    colour,
    x,
    metalness = 0
) {
    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            length,
            32
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: colour,
            roughness: 0.65,
            metalness: metalness
        });

    const object =
        new THREE.Mesh(
            geometry,
            material
        );

    object.rotation.z =
        Math.PI / 2;

    object.position.x =
        x;

    return object;
}

function createTextSprite(
    text,
    width,
    height,
    background = "#111111",
    foreground = "#ffffff"
) {
    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        1024;

    canvas.height =
        256;

    const context =
        canvas.getContext(
            "2d"
        );

    context.fillStyle =
        background;

    context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    context.fillStyle =
        foreground;

    context.font =
        "bold 100px Arial";

    context.textAlign =
        "center";

    context.textBaseline =
        "middle";

    context.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.scale.set(
        width,
        height,
        1
    );

    return sprite;
}

const mindarThree =
    new MindARThree({
        container:
            container,

        imageTargetSrc:
            "./targets/cable-end-b.mind"
    });

const {
    renderer,
    scene,
    camera
} = mindarThree;

const anchor =
    mindarThree.addAnchor(
        0
    );

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2.5
    );

scene.add(
    ambient
);

const directional =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

directional.position.set(
    -2,
    3,
    4
);

scene.add(
    directional
);

const cableGroup =
    new THREE.Group();

const cores = [
    { y: 0.030, z: 0.030 },
    { y: 0.030, z: -0.030 },
    { y: -0.030, z: 0.030 },
    { y: -0.030, z: -0.030 }
];

const outer =
    createHorizontalCylinder(
        0.095,
        0.48,
        0x111111,
        0.18
    );

cableGroup.add(
    outer
);

const bedding =
    createHorizontalCylinder(
        0.067,
        0.64,
        0xd9c9a3,
        0.10
    );

cableGroup.add(
    bedding
);

const armourCount =
    24;

const armourRadius =
    0.079;

for (
    let i = 0;
    i < armourCount;
    i++
) {
    const angle =
        (
            i /
            armourCount
        )
        *
        Math.PI
        *
        2;

    const armour =
        createHorizontalCylinder(
            0.005,
            0.56,
            0x888888,
            0.14,
            0.85
        );

    armour.position.y =
        Math.cos(angle)
        *
        armourRadius;

    armour.position.z =
        Math.sin(angle)
        *
        armourRadius;

    cableGroup.add(
        armour
    );
}

for (
    let i = 0;
    i < cores.length;
    i++
) {
    const core =
        cores[i];

    const insulationColour =
        (
            i === 3
            ?
            0x222222
            :
            0x888888
        );

    const insulation =
        createHorizontalCylinder(
            0.018,
            0.88,
            insulationColour,
            -0.02
        );

    insulation.position.y =
        core.y;

    insulation.position.z =
        core.z;

    cableGroup.add(
        insulation
    );

    const copper =
        createHorizontalCylinder(
            0.010,
            0.10,
            0xb87333,
            -0.51,
            0.8
        );

    copper.position.y =
        core.y;

    copper.position.z =
        core.z;

    cableGroup.add(
        copper
    );
}

for (
    let i = 0;
    i < 3;
    i++
) {
    const label =
        createTextSprite(
            "CORE "
            +
            (
                i + 1
            ),
            0.16,
            0.045
        );

    label.position.set(
        -0.60,
        cores[i].y,
        0.08
        +
        cores[i].z
    );

    cableGroup.add(
        label
    );
}

cableGroup.position.set(
    0,
    0,
    0.12
);

cableGroup.rotation.z =
    0.10;

anchor.group.add(
    cableGroup
);

anchor.onTargetFound =
    () => {
        statusText.textContent =
            cableConfig.label
            +
            " End B detected";
    };

anchor.onTargetLost =
    () => {
        statusText.textContent =
            "Point camera at Cable End B tracking sheet";
    };

function getReading(
    coreIndex
) {
    if (
        cableConfig.faultCore
        ===
        coreIndex
    ) {
        return "OL";
    }

    return (
        session.assignments[
            coreIndex
        ]
        +
        " Ω"
    );
}

function updateRecordPanel() {
    recordPanel.innerHTML =

        "Core 1: "
        +
        (
            readings[0]
            ??
            "Not measured"
        )

        +

        "<br>Core 2: "
        +
        (
            readings[1]
            ??
            "Not measured"
        )

        +

        "<br>Core 3: "
        +
        (
            readings[2]
            ??
            "Not measured"
        );
}

startButton.addEventListener(
    "click",
    async () => {
        try {
            statusText.textContent =
                "Starting AR...";

            startButton.disabled =
                true;

            await mindarThree.start();

            startButton.style.display =
                "none";

            statusText.textContent =
                "Point camera at Cable End B tracking sheet";

            renderer.setAnimationLoop(
                () => {
                    renderer.render(
                        scene,
                        camera
                    );
                }
            );
        }

        catch (
            error
        ) {
            console.error(
                error
            );

            statusText.textContent =
                "AR startup failed";

            startButton.disabled =
                false;
        }
    }
);

measureButtons.forEach(
    button => {
        button.addEventListener(
            "click",
            () => {
                if (
                    !session
                ) {
                    return;
                }

                const coreIndex =
                    Number(
                        button.dataset.core
                    );

                const reading =
                    getReading(
                        coreIndex
                    );

                readings[
                    coreIndex
                ] =
                    reading;

                meterDisplay.textContent =
                    reading;

                button.classList.add(
                    "measured"
                );

                statusText.textContent =
                    "Core "
                    +
                    (
                        coreIndex + 1
                    )
                    +
                    " measured";

                updateRecordPanel();
            }
        );
    }
);

finishButton.addEventListener(
    "click",
    () => {
        const allMeasured =
            readings.every(
                value =>
                    value !== null
            );

        if (
            !allMeasured
        ) {
            statusText.textContent =
                "Measure all three phase cores first";

            return;
        }

        session.endBCompleted =
            true;

        session.readings =
            readings;

        localStorage.setItem(
            storageKey,
            JSON.stringify(
                session
            )
        );

        if (
            readings.includes(
                "OL"
            )
        ) {
            statusText.textContent =
                "✓ MEASUREMENT COMPLETE — OPEN CIRCUIT DETECTED";
        }

        else {
            statusText.textContent =
                "✓ MEASUREMENT COMPLETE";
        }
    }
);

restartButton.addEventListener(
    "click",
    () => {
        window.location.href =
            "./d04-end-a.html?set="
            +
            cableSet;
    }
);
</script>
</body>
</html>
