<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-05 Cable End B</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
        #container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

        #topControl {
            position: absolute; top: 10px; left: 10px; z-index: 5;
            max-width: calc(100% - 20px);
            background: rgba(0,0,0,0.82); color: white;
            padding: 10px; border-radius: 10px;
        }

        #setLabel { font-weight: bold; margin-bottom: 5px; }
        #status { margin-top: 6px; font-size: 13px; }
        #startButton { padding: 10px 15px; font-weight: bold; }

        #meterPanel {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 20px); max-width: 480px; z-index: 5;
            background: rgba(0,0,0,0.86); color: white;
            padding: 12px; border-radius: 12px;
        }

        #meterTitle { font-weight: bold; margin-bottom: 8px; }

        #meterDisplay {
            background: #b7caa5; color: #111;
            border: 4px solid #333; border-radius: 7px;
            padding: 12px; margin-bottom: 10px;
            text-align: right;
            font-family: "Courier New", monospace;
            font-size: 34px; font-weight: bold;
        }

        .row { display: flex; gap: 6px; margin-bottom: 8px; }

        .row button {
            flex: 1; padding: 11px 5px;
            border: none; border-radius: 7px; font-weight: bold;
        }

        .measured { opacity: 0.55; }

        #recordPanel {
            background: rgba(255,255,255,0.10);
            border-radius: 8px; padding: 8px;
            font-size: 13px; line-height: 1.6;
        }

        #finishButton {
            width: 100%; padding: 12px; margin-top: 8px;
            border: none; border-radius: 8px;
            background: #289b42; color: white; font-weight: bold;
        }

        #restartButton {
            width: 100%; padding: 10px; margin-top: 6px;
            border: none; border-radius: 8px;
            background: #666; color: white; font-weight: bold;
        }
    </style>
</head>

<body>
<div id="container">

    <div id="topControl">
        <div id="setLabel">Cable Set</div>
        <button id="startButton">START AR</button>
        <div id="status">Ready</div>
    </div>

    <div id="meterPanel">
        <div id="meterTitle">DIGITAL MULTIMETER — Ω</div>

        <div id="meterDisplay">----</div>

        <div class="row">
            <button class="measureButton" data-core="0">MEASURE CORE 1</button>
            <button class="measureButton" data-core="1">MEASURE CORE 2</button>
            <button class="measureButton" data-core="2">MEASURE CORE 3</button>
        </div>

        <div id="recordPanel">
            Core 1: Not measured<br>
            Core 2: Not measured<br>
            Core 3: Not measured
        </div>

        <button id="finishButton">COMPLETE MEASUREMENT</button>
        <button id="restartButton">RETURN TO END A</button>
    </div>
</div>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

import {
    CABLE_SETS,
    getCableSetFromUrl,
    getStorageKey
} from "./cable-config.js";

// ======================================================
// Cable set + saved session
// ======================================================

const cableSet =
    getCableSetFromUrl();

const cableConfig =
    CABLE_SETS[
        cableSet
    ];

const storageKey =
    getStorageKey(
        cableSet
    );

const storedSession =
    localStorage.getItem(
        storageKey
    );

let session =
    storedSession
    ?
    JSON.parse(
        storedSession
    )
    :
    null;

// ======================================================
// UI
// ======================================================

const container =
    document.querySelector(
        "#container"
    );

const startButton =
    document.querySelector(
        "#startButton"
    );

const statusText =
    document.querySelector(
        "#status"
    );

const setLabel =
    document.querySelector(
        "#setLabel"
    );

const meterDisplay =
    document.querySelector(
        "#meterDisplay"
    );

const recordPanel =
    document.querySelector(
        "#recordPanel"
    );

const measureButtons =
    document.querySelectorAll(
        ".measureButton"
    );

const finishButton =
    document.querySelector(
        "#finishButton"
    );

const restartButton =
    document.querySelector(
        "#restartButton"
    );

setLabel.textContent =
    cableConfig.label
    +
    " — END B";

if (
    !session ||
    !session.endACompleted
) {
    statusText.textContent =
        "Complete this cable's End A first";

    startButton.disabled =
        true;

    measureButtons.forEach(
        button => {
            button.disabled =
                true;
        }
    );
}

// ======================================================
// Measurement state
// ======================================================

const readings = [
    null,
    null,
    null
];

let activeCore =
    null;

// ======================================================
// Vertical cable geometry
// ======================================================

const corePositions = [
    { label: "Core 1", x:  0.060, y:  0.060 },
    { label: "Core 2", x:  0.060, y: -0.060 },
    { label: "Core 3", x: -0.060, y:  0.060 },
    { label: "Neutral",x: -0.060, y: -0.060 }
];

const CABLE_ORIGIN =
    new THREE.Vector3(
        -0.26,
        0.10,
        0.02
    );

const METER_ORIGIN =
    new THREE.Vector3(
        0.36,
        -0.18,
        0.085
    );

// ======================================================
// Helpers
// ======================================================

function createZCylinder(
    radius,
    length,
    colour,
    z,
    metalness = 0,
    roughness = 0.65
) {
    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            length,
            32
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: colour,
            roughness: roughness,
            metalness: metalness
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.rotation.x =
        Math.PI / 2;

    mesh.position.z =
        z;

    return mesh;
}

function createTextSprite(
    text,
    width,
    height,
    background = "#111111",
    foreground = "#ffffff"
) {
    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        1024;

    canvas.height =
        256;

    const context =
        canvas.getContext(
            "2d"
        );

    context.fillStyle =
        background;

    context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    context.fillStyle =
        foreground;

    context.font =
        "bold 96px Arial";

    context.textAlign =
        "center";

    context.textBaseline =
        "middle";

    context.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.scale.set(
        width,
        height,
        1
    );

    return sprite;
}

function createCurvedLead(
    start,
    end,
    colour,
    lift = 0.18
) {
    const middle =
        new THREE.Vector3()
            .addVectors(
                start,
                end
            )
            .multiplyScalar(
                0.5
            );

    middle.z +=
        lift;

    const curve =
        new THREE.QuadraticBezierCurve3(
            start,
            middle,
            end
        );

    const geometry =
        new THREE.TubeGeometry(
            curve,
            32,
            0.009,
            10,
            false
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: colour,
            roughness: 0.45
        });

    return new THREE.Mesh(
        geometry,
        material
    );
}

function pointInAnchorFromGroup(
    group,
    localPoint
) {
    const world =
        group.localToWorld(
            localPoint.clone()
        );

    return anchor.group.worldToLocal(
        world
    );
}

// ======================================================
// MindAR
// ======================================================

const mindarThree =
    new MindARThree({
        container:
            container,

        imageTargetSrc:
            "./targets/cable-end-b.mind"
    });

const {
    renderer,
    scene,
    camera
} = mindarThree;

const anchor =
    mindarThree.addAnchor(
        0
    );

// ======================================================
// Lights
// ======================================================

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2.7
    );

scene.add(
    ambient
);

const directional =
    new THREE.DirectionalLight(
        0xffffff,
        2.8
    );

directional.position.set(
    -2,
    3,
    5
);

scene.add(
    directional
);

// ======================================================
// Build vertical End B cable
// ======================================================

const cableGroup =
    new THREE.Group();

cableGroup.position.copy(
    CABLE_ORIGIN
);

// Ground collar.
const groundRing =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            0.25,
            0.035,
            12,
            40
        ),
        new THREE.MeshStandardMaterial({
            color: 0x4d3c2e,
            roughness: 1
        })
    );

groundRing.position.z =
    0.025;

cableGroup.add(
    groundRing
);

// Outer jacket.
const outer =
    createZCylinder(
        0.19,
        0.48,
        0x111111,
        0.26,
        0,
        0.8
    );

cableGroup.add(
    outer
);

// Bedding.
const bedding =
    createZCylinder(
        0.135,
        0.62,
        0xd9c9a3,
        0.38
    );

cableGroup.add(
    bedding
);

// Armour strands.
const armourCount =
    26;

const armourRadius =
    0.158;

for (
    let i = 0;
    i < armourCount;
    i++
) {
    const angle =
        (
            i /
            armourCount
        )
        *
        Math.PI
        *
        2;

    const armour =
        createZCylinder(
            0.010,
            0.36,
            0x888888,
            0.50,
            0.85,
            0.30
        );

    armour.position.x =
        Math.cos(angle)
        *
        armourRadius;

    armour.position.y =
        Math.sin(angle)
        *
        armourRadius;

    cableGroup.add(
        armour
    );
}

// End B phase insulation is neutral grey.
// Student must identify using measurements, not colour.
for (
    let i = 0;
    i < corePositions.length;
    i++
) {
    const core =
        corePositions[i];

    const colour =
        i === 3
        ?
        0x222222
        :
        0x888888;

    const insulation =
        createZCylinder(
            0.035,
            0.82,
            colour,
            0.72
        );

    insulation.position.x =
        core.x;

    insulation.position.y =
        core.y;

    cableGroup.add(
        insulation
    );

    const copper =
        createZCylinder(
            0.019,
            0.16,
            0xb87333,
            1.21,
            0.75,
            0.30
        );

    copper.position.x =
        core.x;

    copper.position.y =
        core.y;

    cableGroup.add(
        copper
    );
}

// Core labels.
for (
    let i = 0;
    i < 3;
    i++
) {
    const label =
        createTextSprite(
            "CORE "
            +
            (
                i + 1
            ),
            0.18,
            0.048
        );

    label.position.set(
        corePositions[i].x,
        corePositions[i].y - 0.12,
        1.30
    );

    cableGroup.add(
        label
    );
}

anchor.group.add(
    cableGroup
);

// ======================================================
// Build separate 3D multimeter
// ======================================================

const meterGroup =
    new THREE.Group();

meterGroup.position.copy(
    METER_ORIGIN
);

// Meter body.
const meterBody =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.34,
            0.46,
            0.10
        ),
        new THREE.MeshStandardMaterial({
            color: 0x2c2c2c,
            roughness: 0.75
        })
    );

meterGroup.add(
    meterBody
);

// Yellow protective outer rim.
const meterRim =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.38,
            0.50,
            0.075
        ),
        new THREE.MeshStandardMaterial({
            color: 0xd4a900,
            roughness: 0.65
        })
    );

meterRim.position.z =
    -0.020;

meterGroup.add(
    meterRim
);

// Bring main body visually forward.
meterBody.position.z =
    0.015;

// Display.
const display =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.24,
            0.10,
            0.015
        ),
        new THREE.MeshStandardMaterial({
            color: 0xb7caa5,
            roughness: 0.35
        })
    );

display.position.set(
    0,
    0.115,
    0.075
);

meterGroup.add(
    display
);

const displayText =
    createTextSprite(
        "Ω",
        0.12,
        0.05,
        "#b7caa5",
        "#111111"
    );

displayText.position.set(
    0,
    0.115,
    0.087
);

meterGroup.add(
    displayText
);

// Rotary dial.
const dial =
    createZCylinder(
        0.060,
        0.025,
        0x111111,
        0.075,
        0,
        0.4
    );

dial.position.y =
    -0.035;

meterGroup.add(
    dial
);

// Black and red jacks.
const blackJack =
    createZCylinder(
        0.020,
        0.028,
        0x111111,
        0.075
    );

blackJack.position.set(
    -0.065,
    -0.165,
    0.075
);

meterGroup.add(
    blackJack
);

const redJack =
    createZCylinder(
        0.020,
        0.028,
        0xcc2222,
        0.075
    );

redJack.position.set(
    0.065,
    -0.165,
    0.075
);

meterGroup.add(
    redJack
);

anchor.group.add(
    meterGroup
);

// ======================================================
// Probe lead locations
// ======================================================

function getCoreTipAnchorPoint(
    coreIndex
) {
    const core =
        corePositions[
            coreIndex
        ];

    return pointInAnchorFromGroup(
        cableGroup,
        new THREE.Vector3(
            core.x,
            core.y,
            1.30
        )
    );
}

function getArmourAnchorPoint() {
    return pointInAnchorFromGroup(
        cableGroup,
        new THREE.Vector3(
            0.158,
            0,
            0.63
        )
    );
}

function getMeterJackAnchorPoint(
    isRed
) {
    return pointInAnchorFromGroup(
        meterGroup,
        new THREE.Vector3(
            isRed ? 0.065 : -0.065,
            -0.165,
            0.09
        )
    );
}

// ======================================================
// Black lead is permanently connected to armour.
// ======================================================

const blackLead =
    createCurvedLead(
        getMeterJackAnchorPoint(
            false
        ),
        getArmourAnchorPoint(),
        0x111111,
        0.20
    );

anchor.group.add(
    blackLead
);

// Red lead changes destination each time a core is measured.
let redLead =
    null;

function connectRedProbeToCore(
    coreIndex
) {
    if (
        redLead
    ) {
        anchor.group.remove(
            redLead
        );

        redLead.geometry.dispose();
        redLead.material.dispose();

        redLead =
            null;
    }

    redLead =
        createCurvedLead(
            getMeterJackAnchorPoint(
                true
            ),
            getCoreTipAnchorPoint(
                coreIndex
            ),
            0xcc2222,
            0.26
        );

    anchor.group.add(
        redLead
    );
}

// ======================================================
// Tracking
// ======================================================

anchor.onTargetFound =
    () => {
        statusText.textContent =
            cableConfig.label
            +
            " End B detected";
    };

anchor.onTargetLost =
    () => {
        statusText.textContent =
            "Point camera at Cable End B tracking sheet";
    };

// ======================================================
// Measurement logic
// ======================================================

function getReading(
    coreIndex
) {
    if (
        cableConfig.faultCore
        ===
        coreIndex
    ) {
        return "OL";
    }

    return (
        session.assignments[
            coreIndex
        ]
        +
        " Ω"
    );
}

function updateRecordPanel() {
    recordPanel.innerHTML =
        "Core 1: "
        +
        (
            readings[0]
            ??
            "Not measured"
        )
        +
        "<br>Core 2: "
        +
        (
            readings[1]
            ??
            "Not measured"
        )
        +
        "<br>Core 3: "
        +
        (
            readings[2]
            ??
            "Not measured"
        );
}

// ======================================================
// Start AR
// ======================================================

startButton.addEventListener(
    "click",
    async () => {
        try {
            statusText.textContent =
                "Starting AR...";

            startButton.disabled =
                true;

            await mindarThree.start();

            startButton.style.display =
                "none";

            statusText.textContent =
                "Point camera at Cable End B tracking sheet";

            renderer.setAnimationLoop(
                () => {
                    renderer.render(
                        scene,
                        camera
                    );
                }
            );
        }

        catch (
            error
        ) {
            console.error(
                error
            );

            statusText.textContent =
                "AR startup failed";

            startButton.disabled =
                false;
        }
    }
);

// ======================================================
// Measure core
// ======================================================

measureButtons.forEach(
    button => {
        button.addEventListener(
            "click",
            () => {
                if (
                    !session
                ) {
                    return;
                }

                const coreIndex =
                    Number(
                        button.dataset.core
                    );

                activeCore =
                    coreIndex;

                // Visually move the red probe lead.
                connectRedProbeToCore(
                    coreIndex
                );

                const reading =
                    getReading(
                        coreIndex
                    );

                readings[
                    coreIndex
                ] =
                    reading;

                meterDisplay.textContent =
                    reading;

                button.classList.add(
                    "measured"
                );

                statusText.textContent =
                    "Red probe connected to Core "
                    +
                    (
                        coreIndex + 1
                    );

                updateRecordPanel();
            }
        );
    }
);

// ======================================================
// Complete measurement
// ======================================================

finishButton.addEventListener(
    "click",
    () => {
        const allMeasured =
            readings.every(
                value =>
                    value !== null
            );

        if (
            !allMeasured
        ) {
            statusText.textContent =
                "Measure all three phase cores first";

            return;
        }

        session.endBCompleted =
            true;

        session.readings =
            readings;

        localStorage.setItem(
            storageKey,
            JSON.stringify(
                session
            )
        );

        if (
            readings.includes(
                "OL"
            )
        ) {
            statusText.textContent =
                "✓ MEASUREMENT COMPLETE — OPEN CIRCUIT DETECTED";
        }

        else {
            statusText.textContent =
                "✓ MEASUREMENT COMPLETE";
        }
    }
);

// ======================================================
// Return to End A
// ======================================================

restartButton.addEventListener(
    "click",
    () => {
        window.location.href =
            "./d04-end-a.html?set="
            +
            cableSet;
    }
);
</script>
</body>
</html>
