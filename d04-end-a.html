<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-04 Cable End A</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
        #container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

        #topControl {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            background: rgba(0,0,0,0.80);
            color: white;
            padding: 10px;
            border-radius: 10px;
            max-width: calc(100% - 20px);
        }

        #topControl button { padding: 10px 15px; font-weight: bold; }
        #setLabel { font-weight: bold; margin-bottom: 5px; }
        #status { margin-top: 6px; font-size: 13px; }

        #practicalPanel {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 20px);
            max-width: 480px;
            z-index: 5;
            background: rgba(0,0,0,0.84);
            color: white;
            padding: 12px;
            border-radius: 12px;
        }

        .title { font-weight: bold; margin-bottom: 8px; font-size: 13px; }
        .row { display: flex; gap: 6px; margin-bottom: 8px; }
        .row button {
            flex: 1;
            padding: 10px 5px;
            border: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .selected { outline: 3px solid white; }
        .used { opacity: 0.35; }

        #neutralButton {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            margin-bottom: 8px;
            border: none;
            border-radius: 7px;
            font-weight: bold;
        }

        #summary {
            background: rgba(255,255,255,0.12);
            border-radius: 7px;
            padding: 8px;
            font-size: 13px;
            line-height: 1.5;
        }

        #resetButton { background: #777; color: white; }
        #confirmButton { background: #289b42; color: white; }

        #proceedButton {
            display: none;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #e0a400;
            color: #111;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div id="container">

    <div id="topControl">
        <div id="setLabel">Cable Set</div>

        <button id="startButton">
            START AR
        </button>

        <div id="status">
            AR not started
        </div>
    </div>

    <div id="practicalPanel">

        <div class="title">
            STEP 1 — Select Resistance Box Terminal
        </div>

        <div class="row">
            <button class="resistor" data-ohms="100">100 Ω</button>
            <button class="resistor" data-ohms="220">220 Ω</button>
            <button class="resistor" data-ohms="330">330 Ω</button>
        </div>

        <div class="title">
            STEP 2 — Select Cable Core
        </div>

        <div class="row">
            <button class="coreButton" data-core="0">CORE 1</button>
            <button class="coreButton" data-core="1">CORE 2</button>
            <button class="coreButton" data-core="2">CORE 3</button>
        </div>

        <button id="neutralButton">
            CONNECT NEUTRAL → ARMOUR
        </button>

        <div id="summary">
            Core 1: Not connected<br>
            Core 2: Not connected<br>
            Core 3: Not connected<br>
            Neutral → Armour: Not connected
        </div>

        <div class="row" style="margin-top: 8px;">
            <button id="resetButton">RESET</button>
            <button id="confirmButton">CONFIRM END A</button>
        </div>

        <button id="proceedButton">
            PROCEED TO END B
        </button>
    </div>
</div>

<script type="module">
import * as THREE from "three";

import {
    MindARThree
} from "mindar-image-three";

import {
    CABLE_SETS,
    getCableSetFromUrl,
    getStorageKey
} from "./cable-config.js";

const cableSet = getCableSetFromUrl();
const cableConfig = CABLE_SETS[cableSet];

let mindarThree = null;
let renderer = null;
let scene = null;
let camera = null;
let anchor = null;
let cableGroup = null;

const startButton = document.querySelector("#startButton");
const statusText = document.querySelector("#status");
const setLabel = document.querySelector("#setLabel");
const summary = document.querySelector("#summary");
const resistorButtons = document.querySelectorAll(".resistor");
const coreButtons = document.querySelectorAll(".coreButton");
const neutralButton = document.querySelector("#neutralButton");
const resetButton = document.querySelector("#resetButton");
const confirmButton = document.querySelector("#confirmButton");
const proceedButton = document.querySelector("#proceedButton");

setLabel.textContent = cableConfig.label + " — END A";

let selectedResistor = null;

const assignments = [
    null,
    null,
    null
];

let neutralConnected = false;

const visualConnections = [];
let neutralVisual = null;

const cores = [
    {
        label: "Core 1",
        y: 0.030,
        z: 0.030,
        color: 0xcc2222
    },

    {
        label: "Core 2",
        y: 0.030,
        z: -0.030,
        color: 0xe0c000
    },

    {
        label: "Core 3",
        y: -0.030,
        z: 0.030,
        color: 0x2255cc
    },

    {
        label: "Neutral",
        y: -0.030,
        z: -0.030,
        color: 0x222222
    }
];

const RESISTANCE_BOX_Y_OFFSET = -0.25;

const terminalPositions = {
    100: new THREE.Vector3(-0.38, -0.22, 0.105),
    220: new THREE.Vector3(-0.20, -0.22, 0.105),
    330: new THREE.Vector3(-0.02, -0.22, 0.105)
};

function createCylinder(
    radius,
    length,
    colour,
    x,
    metalness = 0
) {
    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            length,
            32
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: colour,
            roughness: 0.65,
            metalness: metalness
        });

    const object =
        new THREE.Mesh(
            geometry,
            material
        );

    object.rotation.z =
        Math.PI / 2;

    object.position.x =
        x;

    return object;
}

function createTextLabel(
    text,
    width = 0.13,
    height = 0.035
) {
    const labelCanvas =
        document.createElement(
            "canvas"
        );

    labelCanvas.width =
        512;

    labelCanvas.height =
        128;

    const context =
        labelCanvas.getContext(
            "2d"
        );

    context.fillStyle =
        "#ffffff";

    context.fillRect(
        0,
        0,
        labelCanvas.width,
        labelCanvas.height
    );

    context.fillStyle =
        "#111111";

    context.font =
        "bold 58px Arial";

    context.textAlign =
        "center";

    context.textBaseline =
        "middle";

    context.fillText(
        text,
        labelCanvas.width / 2,
        labelCanvas.height / 2
    );

    const texture =
        new THREE.CanvasTexture(
            labelCanvas
        );

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.scale.set(
        width,
        height,
        1
    );

    return sprite;
}

function createWireBetween(
    pointA,
    pointB,
    radius,
    colour
) {
    const direction =
        new THREE.Vector3()
            .subVectors(
                pointB,
                pointA
            );

    const length =
        direction.length();

    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            length,
            12
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: colour,
            roughness: 0.55
        });

    const wire =
        new THREE.Mesh(
            geometry,
            material
        );

    const midpoint =
        new THREE.Vector3()
            .addVectors(
                pointA,
                pointB
            )
            .multiplyScalar(
                0.5
            );

    wire.position.copy(
        midpoint
    );

    const up =
        new THREE.Vector3(
            0,
            1,
            0
        );

    wire.quaternion
        .setFromUnitVectors(
            up,
            direction
                .clone()
                .normalize()
        );

    return wire;
}

function buildCable() {
    cableGroup =
        new THREE.Group();

    const outer =
        createCylinder(
            0.095,
            0.48,
            0x111111,
            0.18
        );

    cableGroup.add(
        outer
    );

    const bedding =
        createCylinder(
            0.067,
            0.64,
            0xd9c9a3,
            0.10
        );

    cableGroup.add(
        bedding
    );

    const armourCount =
        24;

    const armourRadius =
        0.079;

    for (
        let i = 0;
        i < armourCount;
        i++
    ) {
        const angle =
            (
                i /
                armourCount
            )
            *
            Math.PI
            *
            2;

        const armour =
            createCylinder(
                0.005,
                0.56,
                0x888888,
                0.14,
                0.85
            );

        armour.position.y =
            Math.cos(angle)
            *
            armourRadius;

        armour.position.z =
            Math.sin(angle)
            *
            armourRadius;

        cableGroup.add(
            armour
        );
    }

    for (
        const core
        of cores
    ) {
        const insulation =
            createCylinder(
                0.018,
                0.88,
                core.color,
                -0.02
            );

        insulation.position.y =
            core.y;

        insulation.position.z =
            core.z;

        cableGroup.add(
            insulation
        );

        const copper =
            createCylinder(
                0.010,
                0.10,
                0xb87333,
                -0.51,
                0.8
            );

        copper.position.y =
            core.y;

        copper.position.z =
            core.z;

        cableGroup.add(
            copper
        );
    }

    cableGroup.position.set(
        0,
        0,
        0.12
    );

    cableGroup.rotation.z =
        -0.10;

    anchor.group.add(
        cableGroup
    );
}

function buildResistanceBox() {
    const boxGroup =
        new THREE.Group();

    const bodyGeometry =
        new THREE.BoxGeometry(
            0.54,
            0.20,
            0.08
        );

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x303030,
            roughness: 0.75
        });

    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.position.set(
        -0.20,
        -0.22,
        0.05
    );

    boxGroup.add(
        body
    );

    const panelGeometry =
        new THREE.BoxGeometry(
            0.50,
            0.16,
            0.012
        );

    const panelMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xe5d7a0,
            roughness: 0.55
        });

    const panel =
        new THREE.Mesh(
            panelGeometry,
            panelMaterial
        );

    panel.position.set(
        -0.20,
        -0.22,
        0.097
    );

    boxGroup.add(
        panel
    );

    const title =
        createTextLabel(
            "RESISTANCE BOX",
            0.28,
            0.035
        );

    title.position.set(
        -0.20,
        -0.165,
        0.112
    );

    boxGroup.add(
        title
    );

    const terminalValues = [
        100,
        220,
        330
    ];

    const terminalColours = {
        100: 0xdd3333,
        220: 0x3366dd,
        330: 0x33aa55
    };

    for (
        const value
        of terminalValues
    ) {
        const position =
            terminalPositions[
                value
            ];

        const baseGeometry =
            new THREE.CylinderGeometry(
                0.023,
                0.023,
                0.010,
                20
            );

        const baseMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x111111,
                roughness: 0.4
            });

        const base =
            new THREE.Mesh(
                baseGeometry,
                baseMaterial
            );

        base.rotation.x =
            Math.PI / 2;

        base.position.set(
            position.x,
            position.y,
            0.105
        );

        boxGroup.add(
            base
        );

        const terminalGeometry =
            new THREE.CylinderGeometry(
                0.014,
                0.014,
                0.035,
                20
            );

        const terminalMaterial =
            new THREE.MeshStandardMaterial({
                color:
                    terminalColours[
                        value
                    ],
                metalness:
                    0.35,
                roughness:
                    0.35
            });

        const terminal =
            new THREE.Mesh(
                terminalGeometry,
                terminalMaterial
            );

        terminal.rotation.x =
            Math.PI / 2;

        terminal.position.set(
            position.x,
            position.y,
            0.122
        );

        boxGroup.add(
            terminal
        );

        const label =
            createTextLabel(
                value + " Ω",
                0.10,
                0.028
            );

        label.position.set(
            position.x,
            -0.275,
            0.113
        );

        boxGroup.add(
            label
        );
    }

    boxGroup.position.y =
        RESISTANCE_BOX_Y_OFFSET;

    cableGroup.add(
        boxGroup
    );
}

function showResistor(
    coreIndex,
    ohms
) {
    const core =
        cores[
            coreIndex
        ];

    const corePoint =
        new THREE.Vector3(
            -0.56,
            core.y,
            core.z
        );

    const terminalPoint =
        terminalPositions[
            ohms
        ].clone();

    terminalPoint.y +=
        RESISTANCE_BOX_Y_OFFSET;

    const wire =
        createWireBetween(
            corePoint,
            terminalPoint,
            0.005,
            0xffcc33
        );

    cableGroup.add(
        wire
    );

    visualConnections[
        coreIndex
    ] =
        wire;
}

function showNeutralConnection() {
    const neutral =
        cores[3];

    const neutralPoint =
        new THREE.Vector3(
            -0.56,
            neutral.y,
            neutral.z
        );

    const armourPoint =
        new THREE.Vector3(
            -0.15,
            -0.09,
            0
        );

    neutralVisual =
        createWireBetween(
            neutralPoint,
            armourPoint,
            0.005,
            0x00ff66
        );

    cableGroup.add(
        neutralVisual
    );
}

function updateSummary() {
    summary.innerHTML =

        "Core 1: "
        +
        (
            assignments[0] !== null
            ?
            assignments[0] + " Ω"
            :
            "Not connected"
        )

        +

        "<br>Core 2: "
        +
        (
            assignments[1] !== null
            ?
            assignments[1] + " Ω"
            :
            "Not connected"
        )

        +

        "<br>Core 3: "
        +
        (
            assignments[2] !== null
            ?
            assignments[2] + " Ω"
            :
            "Not connected"
        )

        +

        "<br>Neutral → Armour: "
        +
        (
            neutralConnected
            ?
            "Connected"
            :
            "Not connected"
        );
}

function setupAR() {
    mindarThree =
        new MindARThree({
            container:
                document.querySelector(
                    "#container"
                ),

            imageTargetSrc:
                "./targets/cable-end-a.mind"
        });

    ({
        renderer,
        scene,
        camera
    } = mindarThree);

    anchor =
        mindarThree.addAnchor(
            0
        );

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2.5
        );

    scene.add(
        ambient
    );

    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2.5
        );

    directional.position.set(
        -2,
        3,
        4
    );

    scene.add(
        directional
    );

    buildCable();
    buildResistanceBox();

    anchor.onTargetFound =
        () => {
            statusText.textContent =
                cableConfig.label
                +
                " End A detected";
        };

    anchor.onTargetLost =
        () => {
            statusText.textContent =
                "Point camera at Cable End A tracking sheet";
        };
}

async function startAR() {
    if (
        !mindarThree
    ) {
        setupAR();
    }

    statusText.textContent =
        "Starting AR...";

    try {
        await mindarThree.start();

        startButton.style.display =
            "none";

        statusText.textContent =
            "Point camera at Cable End A tracking sheet";

        renderer.setAnimationLoop(
            () => {
                renderer.render(
                    scene,
                    camera
                );
            }
        );
    }

    catch (
        error
    ) {
        console.error(
            error
        );

        statusText.textContent =
            "AR startup failed";
    }
}

startButton.addEventListener(
    "click",
    startAR
);

resistorButtons.forEach(
    button => {
        button.addEventListener(
            "click",
            () => {
                selectedResistor =
                    Number(
                        button.dataset.ohms
                    );

                resistorButtons.forEach(
                    item =>
                        item.classList.remove(
                            "selected"
                        )
                );

                button.classList.add(
                    "selected"
                );

                statusText.textContent =
                    "Now select Core 1, 2 or 3";
            }
        );
    }
);

coreButtons.forEach(
    button => {
        button.addEventListener(
            "click",
            () => {
                if (
                    selectedResistor === null
                ) {
                    statusText.textContent =
                        "Select a resistance terminal first";

                    return;
                }

                const coreIndex =
                    Number(
                        button.dataset.core
                    );

                if (
                    assignments[
                        coreIndex
                    ] !== null
                ) {
                    statusText.textContent =
                        "That core already has a connection";

                    return;
                }

                if (
                    assignments.includes(
                        selectedResistor
                    )
                ) {
                    statusText.textContent =
                        "That resistance terminal is already used";

                    return;
                }

                assignments[
                    coreIndex
                ] =
                    selectedResistor;

                showResistor(
                    coreIndex,
                    selectedResistor
                );

                resistorButtons.forEach(
                    resistorButton => {
                        if (
                            Number(
                                resistorButton.dataset.ohms
                            )
                            ===
                            selectedResistor
                        ) {
                            resistorButton.disabled =
                                true;

                            resistorButton.classList.add(
                                "used"
                            );
                        }

                        resistorButton.classList.remove(
                            "selected"
                        );
                    }
                );

                statusText.textContent =
                    selectedResistor
                    +
                    " Ω terminal connected to Core "
                    +
                    (
                        coreIndex + 1
                    );

                selectedResistor =
                    null;

                updateSummary();
            }
        );
    }
);

neutralButton.addEventListener(
    "click",
    () => {
        if (
            neutralConnected
        ) {
            return;
        }

        neutralConnected =
            true;

        showNeutralConnection();

        neutralButton.disabled =
            true;

        neutralButton.textContent =
            "NEUTRAL → ARMOUR CONNECTED";

        statusText.textContent =
            "Neutral connected to armour";

        updateSummary();
    }
);

resetButton.addEventListener(
    "click",
    () => {
        for (
            const visual
            of visualConnections
        ) {
            if (
                visual
            ) {
                cableGroup.remove(
                    visual
                );
            }
        }

        visualConnections.length =
            0;

        if (
            neutralVisual
        ) {
            cableGroup.remove(
                neutralVisual
            );

            neutralVisual =
                null;
        }

        assignments[0] =
            null;

        assignments[1] =
            null;

        assignments[2] =
            null;

        selectedResistor =
            null;

        neutralConnected =
            false;

        resistorButtons.forEach(
            button => {
                button.disabled =
                    false;

                button.classList.remove(
                    "selected",
                    "used"
                );
            }
        );

        neutralButton.disabled =
            false;

        neutralButton.textContent =
            "CONNECT NEUTRAL → ARMOUR";

        confirmButton.disabled =
            false;

        proceedButton.style.display =
            "none";

        updateSummary();

        statusText.textContent =
            "Connections reset";
    }
);

confirmButton.addEventListener(
    "click",
    () => {
        const completed =
            assignments.every(
                value =>
                    value !== null
            );

        if (
            !completed
        ) {
            statusText.textContent =
                "Connect all three phase cores";

            return;
        }

        if (
            !neutralConnected
        ) {
            statusText.textContent =
                "Connect Neutral to Armour";

            return;
        }

        const sessionData = {
            cableSet:
                cableSet,

            assignments: [
                assignments[0],
                assignments[1],
                assignments[2]
            ],

            neutralConnected:
                true,

            endACompleted:
                true,

            savedAt:
                Date.now()
        };

        localStorage.setItem(
            getStorageKey(
                cableSet
            ),
            JSON.stringify(
                sessionData
            )
        );

        confirmButton.disabled =
            true;

        proceedButton.style.display =
            "block";

        statusText.textContent =
            "✓ "
            +
            cableConfig.label
            +
            " END A COMPLETE";
    }
);

proceedButton.addEventListener(
    "click",
    () => {
        window.location.href =
            "./d05-end-b.html?set="
            +
            cableSet;
    }
);
</script>
</body>
</html>
