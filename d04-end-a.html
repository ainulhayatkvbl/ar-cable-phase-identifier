<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>D-04 Cable End A</title>


    <script type="importmap">
    {
        "imports": {
            "three":
            "https://unpkg.com/three@0.160.0/build/three.module.js",

            "three/addons/":
            "https://unpkg.com/three@0.160.0/examples/jsm/",

            "mindar-image-three":
            "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }


        #container {
            width: 100vw;
            height: 100vh;

            position: relative;

            overflow: hidden;
        }


        #topControl {
            position: absolute;

            top: 10px;
            left: 10px;

            z-index: 3;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            padding: 10px;

            border-radius: 10px;
        }


        #topControl button {
            padding: 10px 15px;
        }


        #status {
            margin-top: 6px;

            font-size: 13px;
        }


        #practicalPanel {

            position: absolute;

            bottom: 10px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);

            max-width: 480px;

            z-index: 3;

            background: rgba(0, 0, 0, 0.82);

            color: white;

            padding: 12px;

            border-radius: 12px;
        }


        .title {
            font-weight: bold;

            margin-bottom: 8px;
        }


        .row {
            display: flex;

            gap: 6px;

            margin-bottom: 8px;
        }


        .row button {

            flex: 1;

            padding: 10px 5px;

            border: none;

            border-radius: 7px;

            font-weight: bold;
        }


        .selected {
            outline: 3px solid white;
        }


        .used {
            opacity: 0.35;
        }


        #summary {

            background: rgba(255, 255, 255, 0.12);

            border-radius: 7px;

            padding: 8px;

            font-size: 13px;

            line-height: 1.5;
        }


        #neutralButton {
            width: 100%;

            padding: 10px;

            margin-top: 8px;

            border: none;

            border-radius: 7px;

            font-weight: bold;
        }


        #actionRow {
            margin-top: 8px;
        }


        #resetButton {
            background: #777;
            color: white;
        }


        #confirmButton {
            background: #289b42;
            color: white;
        }

    </style>

</head>


<body>


<div id="container">


    <div id="topControl">

        <button id="startButton">
            START AR
        </button>

        <div id="status">
            AR not started
        </div>

    </div>


    <div id="practicalPanel">

        <div class="title">
            STEP 1 — Select Resistor
        </div>


        <div class="row">

            <button
                class="resistor"
                data-ohms="100">
                100 Ω
            </button>

            <button
                class="resistor"
                data-ohms="220">
                220 Ω
            </button>

            <button
                class="resistor"
                data-ohms="330">
                330 Ω
            </button>

        </div>


        <div class="title">
            STEP 2 — Select Phase Core
        </div>


        <div class="row">

            <button
                class="coreButton"
                data-core="0">
                CORE 1
            </button>

            <button
                class="coreButton"
                data-core="1">
                CORE 2
            </button>

            <button
                class="coreButton"
                data-core="2">
                CORE 3
            </button>

        </div>


        <button id="neutralButton">
            CONNECT NEUTRAL → ARMOUR
        </button>


        <div id="summary">

            Core 1: Not connected<br>
            Core 2: Not connected<br>
            Core 3: Not connected<br>
            Neutral → Armour: Not connected

        </div>


        <div
            id="actionRow"
            class="row">

            <button id="resetButton">
                RESET
            </button>

            <button id="confirmButton">
                CONFIRM END A
            </button>

        </div>

    </div>


</div>


<script type="module">

import * as THREE from "three";

import {
    MindARThree
} from "mindar-image-three";


// ======================================================
// D-04 — SIMPLE STABLE VERSION
// ======================================================


let mindarThree = null;

let renderer = null;

let scene = null;

let camera = null;

let anchor = null;

let cableGroup = null;


// ======================================================
// UI
// ======================================================


const startButton =
    document.querySelector(
        "#startButton"
    );


const statusText =
    document.querySelector(
        "#status"
    );


const summary =
    document.querySelector(
        "#summary"
    );


const resistorButtons =
    document.querySelectorAll(
        ".resistor"
    );


const coreButtons =
    document.querySelectorAll(
        ".coreButton"
    );


const neutralButton =
    document.querySelector(
        "#neutralButton"
    );


const resetButton =
    document.querySelector(
        "#resetButton"
    );


const confirmButton =
    document.querySelector(
        "#confirmButton"
    );


// ======================================================
// Practical state
// ======================================================


let selectedResistor =
    null;


const assignments = [
    null,
    null,
    null
];


let neutralConnected =
    false;


const visualConnections = [];


// ======================================================
// Cable dimensions
// ======================================================


const cores = [

    {
        y: 0.030,
        z: 0.030,
        color: 0xcc2222
    },

    {
        y: 0.030,
        z: -0.030,
        color: 0xe0c000
    },

    {
        y: -0.030,
        z: 0.030,
        color: 0x2255cc
    },

    {
        y: -0.030,
        z: -0.030,
        color: 0x222222
    }

];


// ======================================================
// Horizontal cylinder
// ======================================================


function createCylinder(
    radius,
    length,
    colour,
    x,
    metalness = 0
) {

    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            length,
            32
        );


    const material =
        new THREE.MeshStandardMaterial({

            color: colour,

            roughness: 0.65,

            metalness: metalness

        });


    const object =
        new THREE.Mesh(
            geometry,
            material
        );


    object.rotation.z =
        Math.PI / 2;


    object.position.x =
        x;


    return object;
}


// ======================================================
// Create cable model
// ======================================================


function buildCable() {


    cableGroup =
        new THREE.Group();


    // ----------------------------------------------
    // Outer sheath
    // ----------------------------------------------


    const outer =
        createCylinder(
            0.095,
            0.48,
            0x111111,
            0.18
        );


    cableGroup.add(
        outer
    );


    // ----------------------------------------------
    // Bedding
    // ----------------------------------------------


    const bedding =
        createCylinder(
            0.067,
            0.64,
            0xd9c9a3,
            0.10
        );


    cableGroup.add(
        bedding
    );


    // ----------------------------------------------
    // Armour
    // ----------------------------------------------


    const armourCount =
        24;


    const armourRadius =
        0.079;


    for (
        let i = 0;
        i < armourCount;
        i++
    ) {


        const angle =
            (
                i /
                armourCount
            )
            *
            Math.PI
            *
            2;


        const armour =
            createCylinder(
                0.005,
                0.56,
                0x888888,
                0.14,
                0.85
            );


        armour.position.y =
            Math.cos(angle)
            *
            armourRadius;


        armour.position.z =
            Math.sin(angle)
            *
            armourRadius;


        cableGroup.add(
            armour
        );

    }


    // ----------------------------------------------
    // Cores
    // ----------------------------------------------


    for (
        const core
        of cores
    ) {


        const insulation =
            createCylinder(
                0.018,
                0.88,
                core.color,
                -0.02
            );


        insulation.position.y =
            core.y;


        insulation.position.z =
            core.z;


        cableGroup.add(
            insulation
        );


        const copper =
            createCylinder(
                0.010,
                0.10,
                0xb87333,
                -0.51,
                0.8
            );


        copper.position.y =
            core.y;


        copper.position.z =
            core.z;


        cableGroup.add(
            copper
        );

    }


    cableGroup.position.set(
        0,
        0,
        0.12
    );


    cableGroup.rotation.z =
        -0.10;


    anchor.group.add(
        cableGroup
    );

}


// ======================================================
// Add resistor visual
// ======================================================


function showResistor(
    coreIndex,
    ohms
) {


    const group =
        new THREE.Group();


    const core =
        cores[
            coreIndex
        ];


    const neutral =
        cores[3];


    // ----------------------------------------------
    // Resistor position
    // ----------------------------------------------


    const resistorX =
        -0.67;


    const resistorY =
        core.y;


    const resistorZ =
        core.z;


    // ----------------------------------------------
    // Resistor body
    // ----------------------------------------------


    let colour =
        0xff8844;


    if (
        ohms === 220
    ) {

        colour =
            0xaa55ff;

    }


    if (
        ohms === 330
    ) {

        colour =
            0x33bbff;

    }


    const bodyGeometry =
        new THREE.BoxGeometry(
            0.10,
            0.035,
            0.035
        );


    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: colour
        });


    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );


    body.position.set(
        resistorX,
        resistorY,
        resistorZ
    );


    group.add(
        body
    );


    // ----------------------------------------------
    // Simple connection line
    // ----------------------------------------------


    const points = [

        new THREE.Vector3(
            -0.56,
            core.y,
            core.z
        ),

        new THREE.Vector3(
            resistorX,
            core.y,
            core.z
        ),

        new THREE.Vector3(
            -0.62,
            neutral.y,
            neutral.z
        )

    ];


    const lineGeometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                points
            );


    const lineMaterial =
        new THREE.LineBasicMaterial({
            color: 0xffffff
        });


    const line =
        new THREE.Line(
            lineGeometry,
            lineMaterial
        );


    group.add(
        line
    );


    cableGroup.add(
        group
    );


    visualConnections[
        coreIndex
    ] =
        group;

}


// ======================================================
// Neutral armour visual
// ======================================================


let neutralVisual =
    null;


function showNeutralConnection() {


    const neutral =
        cores[3];


    const points = [

        new THREE.Vector3(
            -0.56,
            neutral.y,
            neutral.z
        ),

        new THREE.Vector3(
            -0.15,
            -0.09,
            0
        )

    ];


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                points
            );


    const material =
        new THREE.LineBasicMaterial({
            color: 0x00ff66
        });


    neutralVisual =
        new THREE.Line(
            geometry,
            material
        );


    cableGroup.add(
        neutralVisual
    );

}


// ======================================================
// UI summary
// ======================================================


function updateSummary() {


    summary.innerHTML =

        "Core 1: "
        +
        (
            assignments[0]
            ??
            "Not connected"
        )
        +
        (
            assignments[0]
            ?
            " Ω"
            :
            ""
        )


        +

        "<br>Core 2: "
        +
        (
            assignments[1]
            ??
            "Not connected"
        )
        +
        (
            assignments[1]
            ?
            " Ω"
            :
            ""
        )


        +

        "<br>Core 3: "
        +
        (
            assignments[2]
            ??
            "Not connected"
        )
        +
        (
            assignments[2]
            ?
            " Ω"
            :
            ""
        )


        +

        "<br>Neutral → Armour: "
        +
        (
            neutralConnected
            ?
            "Connected"
            :
            "Not connected"
        );

}


// ======================================================
// MindAR setup
// ======================================================


function setupAR() {


    mindarThree =
        new MindARThree({

            container:
                document.querySelector(
                    "#container"
                ),

            imageTargetSrc:
                "./targets/cable-end-a.mind"

        });


    ({
        renderer,
        scene,
        camera
    } = mindarThree);


    anchor =
        mindarThree.addAnchor(
            0
        );


    // ----------------------------------------------
    // Lighting
    // ----------------------------------------------


    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2.5
        );


    scene.add(
        ambient
    );


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2.5
        );


    directional.position.set(
        -2,
        3,
        4
    );


    scene.add(
        directional
    );


    buildCable();


    anchor.onTargetFound =
        () => {

            statusText.textContent =
                "Cable End A detected";

        };


    anchor.onTargetLost =
        () => {

            statusText.textContent =
                "Point camera at tracking sheet";

        };

}


// ======================================================
// Start AR
// ======================================================


async function startAR() {


    if (
        !mindarThree
    ) {

        setupAR();

    }


    statusText.textContent =
        "Starting AR...";


    try {


        await mindarThree.start();


        startButton.style.display =
            "none";


        statusText.textContent =
            "Point camera at tracking sheet";


        renderer.setAnimationLoop(
            () => {

                renderer.render(
                    scene,
                    camera
                );

            }
        );


    }

    catch (
        error
    ) {


        console.error(
            error
        );


        statusText.textContent =
            "AR startup failed";

    }

}


// ======================================================
// Start button
// ======================================================


startButton.addEventListener(
    "click",
    startAR
);


// ======================================================
// Resistor selection
// ======================================================


resistorButtons.forEach(

    button => {


        button.addEventListener(

            "click",

            () => {


                selectedResistor =
                    Number(
                        button.dataset.ohms
                    );


                resistorButtons.forEach(

                    b =>
                        b.classList.remove(
                            "selected"
                        )

                );


                button.classList.add(
                    "selected"
                );


                statusText.textContent =
                    "Now select Core 1, 2 or 3";

            }

        );

    }

);


// ======================================================
// Core selection
// ======================================================


coreButtons.forEach(

    button => {


        button.addEventListener(

            "click",

            () => {


                if (
                    selectedResistor === null
                ) {

                    statusText.textContent =
                        "Select a resistor first";

                    return;

                }


                const coreIndex =
                    Number(
                        button.dataset.core
                    );


                if (
                    assignments[
                        coreIndex
                    ]
                    !==
                    null
                ) {

                    statusText.textContent =
                        "That core already has a resistor";

                    return;

                }


                if (
                    assignments.includes(
                        selectedResistor
                    )
                ) {

                    statusText.textContent =
                        "That resistor has already been used";

                    return;

                }


                assignments[
                    coreIndex
                ] =
                    selectedResistor;


                showResistor(
                    coreIndex,
                    selectedResistor
                );


                resistorButtons.forEach(

                    resistorButton => {


                        if (
                            Number(
                                resistorButton.dataset.ohms
                            )
                            ===
                            selectedResistor
                        ) {

                            resistorButton.disabled =
                                true;


                            resistorButton.classList.add(
                                "used"
                            );

                        }


                        resistorButton.classList.remove(
                            "selected"
                        );

                    }

                );


                statusText.textContent =
                    selectedResistor
                    +
                    " Ω connected to Core "
                    +
                    (
                        coreIndex
                        +
                        1
                    );


                selectedResistor =
                    null;


                updateSummary();

            }

        );

    }

);


// ======================================================
// Neutral
// ======================================================


neutralButton.addEventListener(

    "click",

    () => {


        if (
            neutralConnected
        ) {

            return;

        }


        neutralConnected =
            true;


        showNeutralConnection();


        neutralButton.disabled =
            true;


        neutralButton.textContent =
            "NEUTRAL → ARMOUR CONNECTED";


        updateSummary();


        statusText.textContent =
            "Neutral connected to armour";

    }

);


// ======================================================
// Reset
// ======================================================


resetButton.addEventListener(

    "click",

    () => {


        for (
            const visual
            of visualConnections
        ) {


            if (
                visual
            ) {

                cableGroup.remove(
                    visual
                );

            }

        }


        visualConnections.length =
            0;


        if (
            neutralVisual
        ) {


            cableGroup.remove(
                neutralVisual
            );


            neutralVisual =
                null;

        }


        assignments[0] =
            null;

        assignments[1] =
            null;

        assignments[2] =
            null;


        selectedResistor =
            null;


        neutralConnected =
            false;


        resistorButtons.forEach(

            button => {


                button.disabled =
                    false;


                button.classList.remove(
                    "selected",
                    "used"
                );

            }

        );


        neutralButton.disabled =
            false;


        neutralButton.textContent =
            "CONNECT NEUTRAL → ARMOUR";


        updateSummary();


        statusText.textContent =
            "Connections reset";

    }

);


// ======================================================
// Confirm
// ======================================================


confirmButton.addEventListener(

    "click",

    () => {


        const completed =
            assignments.every(
                value =>
                    value !== null
            );


        if (
            !completed
        ) {

            statusText.textContent =
                "Connect all three resistors";

            return;

        }


        if (
            !neutralConnected
        ) {

            statusText.textContent =
                "Connect Neutral to Armour";

            return;

        }


        statusText.textContent =
            "✓ END A COMPLETE";

    }

);

</script>


</body>

</html>
