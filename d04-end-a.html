<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-04 Cable End A</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
        #container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

        #topControl {
            position: absolute; top: 10px; left: 10px; z-index: 5;
            background: rgba(0,0,0,0.80); color: white;
            padding: 10px; border-radius: 10px;
            max-width: calc(100% - 20px);
        }

        #topControl button { padding: 10px 15px; font-weight: bold; }
        #setLabel { font-weight: bold; margin-bottom: 5px; }
        #status { margin-top: 6px; font-size: 13px; }

        #practicalPanel {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 20px); max-width: 480px; z-index: 5;
            background: rgba(0,0,0,0.84); color: white;
            padding: 12px; border-radius: 12px;
        }

        .title { font-weight: bold; margin-bottom: 8px; font-size: 13px; }
        .row { display: flex; gap: 6px; margin-bottom: 8px; }
        .row button {
            flex: 1; padding: 10px 5px; border: none;
            border-radius: 7px; font-weight: bold;
        }

        .selected { outline: 3px solid white; }
        .used { opacity: 0.35; }

        #neutralButton {
            width: 100%; padding: 10px;
            margin-top: 4px; margin-bottom: 8px;
            border: none; border-radius: 7px; font-weight: bold;
        }

        #summary {
            background: rgba(255,255,255,0.12);
            border-radius: 7px; padding: 8px;
            font-size: 13px; line-height: 1.5;
        }

        #resetButton { background: #777; color: white; }
        #confirmButton { background: #289b42; color: white; }

        #proceedButton {
            display: none; width: 100%; padding: 12px; margin-top: 8px;
            border: none; border-radius: 8px;
            background: #e0a400; color: #111; font-weight: bold;
        }
    </style>
</head>

<body>
<div id="container">

    <div id="topControl">
        <div id="setLabel">Cable Set</div>
        <button id="startButton">START AR</button>
        <div id="status">AR not started</div>
    </div>

    <div id="practicalPanel">

        <div class="title">STEP 1 — Select Resistance Box Terminal</div>

        <div class="row">
            <button class="resistor" data-ohms="100">100 Ω</button>
            <button class="resistor" data-ohms="220">220 Ω</button>
            <button class="resistor" data-ohms="330">330 Ω</button>
        </div>

        <div class="title">STEP 2 — Select Cable Core</div>

        <div class="row">
            <button class="coreButton" data-core="0">CORE 1</button>
            <button class="coreButton" data-core="1">CORE 2</button>
            <button class="coreButton" data-core="2">CORE 3</button>
        </div>

        <button id="neutralButton">CONNECT NEUTRAL → ARMOUR</button>

        <div id="summary">
            Core 1: Not connected<br>
            Core 2: Not connected<br>
            Core 3: Not connected<br>
            Neutral → Armour: Not connected
        </div>

        <div class="row" style="margin-top: 8px;">
            <button id="resetButton">RESET</button>
            <button id="confirmButton">CONFIRM END A</button>
        </div>

        <button id="proceedButton">PROCEED TO END B</button>
    </div>
</div>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

import {
    CABLE_SETS,
    getCableSetFromUrl,
    getStorageKey
} from "./cable-config.js";

// ======================================================
// Cable set
// ======================================================

const cableSet = getCableSetFromUrl();
const cableConfig = CABLE_SETS[cableSet];

// ======================================================
// UI
// ======================================================

const startButton = document.querySelector("#startButton");
const statusText = document.querySelector("#status");
const setLabel = document.querySelector("#setLabel");
const summary = document.querySelector("#summary");
const resistorButtons = document.querySelectorAll(".resistor");
const coreButtons = document.querySelectorAll(".coreButton");
const neutralButton = document.querySelector("#neutralButton");
const resetButton = document.querySelector("#resetButton");
const confirmButton = document.querySelector("#confirmButton");
const proceedButton = document.querySelector("#proceedButton");

setLabel.textContent = cableConfig.label + " — END A";

// ======================================================
// Practical state
// ======================================================

let selectedResistor = null;

const assignments = [
    null,
    null,
    null
];

let neutralConnected = false;

const connectionVisuals = [];
let neutralVisual = null;

// ======================================================
// MindAR
// ======================================================

let mindarThree = null;
let renderer = null;
let scene = null;
let camera = null;
let anchor = null;

// Scene groups are siblings so the vertical cable can be
// positioned independently from the resistance box.
let cableGroup = null;
let boxGroup = null;

// ======================================================
// Geometry constants
// Cable is approximately 2x the previous visual size.
// Marker plane = "ground"; +Z = coming out of the ground.
// ======================================================

const corePositions = [
    { label: "Core 1", x:  0.060, y:  0.060, color: 0xcc2222 },
    { label: "Core 2", x:  0.060, y: -0.060, color: 0xe0c000 },
    { label: "Core 3", x: -0.060, y:  0.060, color: 0x2255cc },
    { label: "Neutral",x: -0.060, y: -0.060, color: 0x222222 }
];

// Cable location relative to marker.
const CABLE_ORIGIN = new THREE.Vector3(
    -0.25,
    0.08,
    0.02
);

// Resistance box is well separated from the cable.
const BOX_ORIGIN = new THREE.Vector3(
    0.34,
    -0.20,
    0.055
);

const terminalLocalPositions = {
    100: new THREE.Vector3(-0.18, 0.00, 0.105),
    220: new THREE.Vector3( 0.00, 0.00, 0.105),
    330: new THREE.Vector3( 0.18, 0.00, 0.105)
};

// ======================================================
// Helpers
// ======================================================

function createZCylinder(
    radius,
    length,
    colour,
    z,
    metalness = 0,
    roughness = 0.65
) {
    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            length,
            32
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: colour,
            roughness: roughness,
            metalness: metalness
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    // Default cylinder axis is Y. Rotate it onto Z.
    mesh.rotation.x = Math.PI / 2;
    mesh.position.z = z;

    return mesh;
}

function createTextLabel(
    text,
    width = 0.18,
    height = 0.045,
    background = "#ffffff",
    foreground = "#111111"
) {
    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 128;

    const context = canvas.getContext("2d");

    context.fillStyle = background;
    context.fillRect(0, 0, canvas.width, canvas.height);

    context.fillStyle = foreground;
    context.font = "bold 56px Arial";
    context.textAlign = "center";
    context.textBaseline = "middle";

    context.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.scale.set(
        width,
        height,
        1
    );

    return sprite;
}

function createWireBetween(
    pointA,
    pointB,
    radius,
    colour
) {
    const direction =
        new THREE.Vector3()
            .subVectors(
                pointB,
                pointA
            );

    const length =
        direction.length();

    const geometry =
        new THREE.CylinderGeometry(
            radius,
            radius,
            length,
            12
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: colour,
            roughness: 0.5
        });

    const wire =
        new THREE.Mesh(
            geometry,
            material
        );

    const midpoint =
        new THREE.Vector3()
            .addVectors(
                pointA,
                pointB
            )
            .multiplyScalar(
                0.5
            );

    wire.position.copy(
        midpoint
    );

    const up =
        new THREE.Vector3(
            0,
            1,
            0
        );

    wire.quaternion.setFromUnitVectors(
        up,
        direction.clone().normalize()
    );

    return wire;
}

function localToAnchor(
    group,
    localPoint
) {
    return group.localToWorld(
        localPoint.clone()
    );
}

// Because group.localToWorld returns world coordinates,
// convert them back to anchor-local coordinates before
// building connection geometry as children of anchor.group.
function worldToAnchor(
    worldPoint
) {
    return anchor.group.worldToLocal(
        worldPoint.clone()
    );
}

function pointInAnchorFromGroup(
    group,
    localPoint
) {
    return worldToAnchor(
        localToAnchor(
            group,
            localPoint
        )
    );
}

// ======================================================
// Ground + vertical cable
// ======================================================

function buildVerticalCable() {
    cableGroup =
        new THREE.Group();

    cableGroup.position.copy(
        CABLE_ORIGIN
    );

    // Ground collar / hole around cable.
    const groundRing =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                0.25,
                0.035,
                12,
                40
            ),
            new THREE.MeshStandardMaterial({
                color: 0x4d3c2e,
                roughness: 1
            })
        );

    groundRing.position.z =
        0.025;

    cableGroup.add(
        groundRing
    );

    // Outer jacket: lower visible section.
    const outer =
        createZCylinder(
            0.19,
            0.48,
            0x111111,
            0.26,
            0,
            0.8
        );

    cableGroup.add(
        outer
    );

    // Bedding rises slightly above the jacket.
    const bedding =
        createZCylinder(
            0.135,
            0.62,
            0xd9c9a3,
            0.38
        );

    cableGroup.add(
        bedding
    );

    // Armour strands around the outside.
    const armourCount =
        26;

    const armourRadius =
        0.158;

    for (
        let i = 0;
        i < armourCount;
        i++
    ) {
        const angle =
            (
                i /
                armourCount
            )
            *
            Math.PI
            *
            2;

        const armour =
            createZCylinder(
                0.010,
                0.36,
                0x888888,
                0.50,
                0.85,
                0.30
            );

        armour.position.x =
            Math.cos(angle)
            *
            armourRadius;

        armour.position.y =
            Math.sin(angle)
            *
            armourRadius;

        cableGroup.add(
            armour
        );
    }

    // Four insulated cores continue out of the top.
    for (
        const core
        of corePositions
    ) {
        const insulation =
            createZCylinder(
                0.035,
                0.82,
                core.color,
                0.72
            );

        insulation.position.x =
            core.x;

        insulation.position.y =
            core.y;

        cableGroup.add(
            insulation
        );

        // Exposed copper at the very top.
        const copper =
            createZCylinder(
                0.019,
                0.16,
                0xb87333,
                1.21,
                0.75,
                0.3
            );

        copper.position.x =
            core.x;

        copper.position.y =
            core.y;

        cableGroup.add(
            copper
        );
    }

    anchor.group.add(
        cableGroup
    );
}

// ======================================================
// Resistance box
// ======================================================

function buildResistanceBox() {
    boxGroup =
        new THREE.Group();

    boxGroup.position.copy(
        BOX_ORIGIN
    );

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.62,
                0.30,
                0.10
            ),
            new THREE.MeshStandardMaterial({
                color: 0x303030,
                roughness: 0.75
            })
        );

    boxGroup.add(
        body
    );

    const panel =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.57,
                0.25,
                0.018
            ),
            new THREE.MeshStandardMaterial({
                color: 0xe5d7a0,
                roughness: 0.55
            })
        );

    panel.position.z =
        0.060;

    boxGroup.add(
        panel
    );

    const title =
        createTextLabel(
            "RESISTANCE BOX",
            0.34,
            0.055
        );

    title.position.set(
        0,
        0.085,
        0.082
    );

    boxGroup.add(
        title
    );

    const terminalColours = {
        100: 0xdd3333,
        220: 0x3366dd,
        330: 0x33aa55
    };

    for (
        const value
        of [100, 220, 330]
    ) {
        const pos =
            terminalLocalPositions[
                value
            ];

        const base =
            createZCylinder(
                0.030,
                0.025,
                0x111111,
                pos.z - 0.012
            );

        base.position.x =
            pos.x;

        base.position.y =
            pos.y;

        boxGroup.add(
            base
        );

        const post =
            createZCylinder(
                0.020,
                0.055,
                terminalColours[value],
                pos.z + 0.018,
                0.35,
                0.35
            );

        post.position.x =
            pos.x;

        post.position.y =
            pos.y;

        boxGroup.add(
            post
        );

        const label =
            createTextLabel(
                value + " Ω",
                0.14,
                0.042
            );

        label.position.set(
            pos.x,
            -0.085,
            0.086
        );

        boxGroup.add(
            label
        );
    }

    anchor.group.add(
        boxGroup
    );
}

// ======================================================
// Connection visuals
// ======================================================

function getCoreTipAnchorPoint(
    coreIndex
) {
    const core =
        corePositions[
            coreIndex
        ];

    const cableLocalPoint =
        new THREE.Vector3(
            core.x,
            core.y,
            1.30
        );

    return pointInAnchorFromGroup(
        cableGroup,
        cableLocalPoint
    );
}

function getTerminalAnchorPoint(
    ohms
) {
    return pointInAnchorFromGroup(
        boxGroup,
        terminalLocalPositions[
            ohms
        ]
    );
}

function showResistanceConnection(
    coreIndex,
    ohms
) {
    const corePoint =
        getCoreTipAnchorPoint(
            coreIndex
        );

    const terminalPoint =
        getTerminalAnchorPoint(
            ohms
        );

    const wire =
        createWireBetween(
            corePoint,
            terminalPoint,
            0.009,
            0xffcc33
        );

    anchor.group.add(
        wire
    );

    connectionVisuals[
        coreIndex
    ] =
        wire;
}

function showNeutralConnection() {
    const neutralPoint =
        getCoreTipAnchorPoint(
            3
        );

    // A visible armour contact point near the top of
    // the exposed armour section.
    const armourPoint =
        pointInAnchorFromGroup(
            cableGroup,
            new THREE.Vector3(
                0.158,
                0,
                0.62
            )
        );

    neutralVisual =
        createWireBetween(
            neutralPoint,
            armourPoint,
            0.010,
            0x00ff66
        );

    anchor.group.add(
        neutralVisual
    );
}

// ======================================================
// Summary
// ======================================================

function updateSummary() {
    summary.innerHTML =
        "Core 1: "
        +
        (
            assignments[0] !== null
            ?
            assignments[0] + " Ω"
            :
            "Not connected"
        )
        +
        "<br>Core 2: "
        +
        (
            assignments[1] !== null
            ?
            assignments[1] + " Ω"
            :
            "Not connected"
        )
        +
        "<br>Core 3: "
        +
        (
            assignments[2] !== null
            ?
            assignments[2] + " Ω"
            :
            "Not connected"
        )
        +
        "<br>Neutral → Armour: "
        +
        (
            neutralConnected
            ?
            "Connected"
            :
            "Not connected"
        );
}

// ======================================================
// AR setup
// ======================================================

function setupAR() {
    mindarThree =
        new MindARThree({
            container:
                document.querySelector(
                    "#container"
                ),
            imageTargetSrc:
                "./targets/cable-end-a.mind"
        });

    ({
        renderer,
        scene,
        camera
    } = mindarThree);

    anchor =
        mindarThree.addAnchor(
            0
        );

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2.7
        );

    scene.add(
        ambient
    );

    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            2.8
        );

    directional.position.set(
        -2,
        3,
        5
    );

    scene.add(
        directional
    );

    buildVerticalCable();
    buildResistanceBox();

    anchor.onTargetFound =
        () => {
            statusText.textContent =
                cableConfig.label
                +
                " End A detected";
        };

    anchor.onTargetLost =
        () => {
            statusText.textContent =
                "Point camera at Cable End A tracking sheet";
        };
}

async function startAR() {
    if (
        !mindarThree
    ) {
        setupAR();
    }

    statusText.textContent =
        "Starting AR...";

    try {
        await mindarThree.start();

        startButton.style.display =
            "none";

        statusText.textContent =
            "Point camera at Cable End A tracking sheet";

        renderer.setAnimationLoop(
            () => {
                renderer.render(
                    scene,
                    camera
                );
            }
        );
    }

    catch (
        error
    ) {
        console.error(
            error
        );

        statusText.textContent =
            "AR startup failed";
    }
}

startButton.addEventListener(
    "click",
    startAR
);

// ======================================================
// End A interactions
// ======================================================

resistorButtons.forEach(
    button => {
        button.addEventListener(
            "click",
            () => {
                selectedResistor =
                    Number(
                        button.dataset.ohms
                    );

                resistorButtons.forEach(
                    item =>
                        item.classList.remove(
                            "selected"
                        )
                );

                button.classList.add(
                    "selected"
                );

                statusText.textContent =
                    "Now select Core 1, 2 or 3";
            }
        );
    }
);

coreButtons.forEach(
    button => {
        button.addEventListener(
            "click",
            () => {
                if (
                    selectedResistor === null
                ) {
                    statusText.textContent =
                        "Select a resistance terminal first";

                    return;
                }

                const coreIndex =
                    Number(
                        button.dataset.core
                    );

                if (
                    assignments[
                        coreIndex
                    ] !== null
                ) {
                    statusText.textContent =
                        "That core already has a connection";

                    return;
                }

                if (
                    assignments.includes(
                        selectedResistor
                    )
                ) {
                    statusText.textContent =
                        "That resistance terminal is already used";

                    return;
                }

                assignments[
                    coreIndex
                ] =
                    selectedResistor;

                showResistanceConnection(
                    coreIndex,
                    selectedResistor
                );

                resistorButtons.forEach(
                    resistorButton => {
                        if (
                            Number(
                                resistorButton.dataset.ohms
                            )
                            ===
                            selectedResistor
                        ) {
                            resistorButton.disabled =
                                true;

                            resistorButton.classList.add(
                                "used"
                            );
                        }

                        resistorButton.classList.remove(
                            "selected"
                        );
                    }
                );

                statusText.textContent =
                    selectedResistor
                    +
                    " Ω connected to Core "
                    +
                    (
                        coreIndex + 1
                    );

                selectedResistor =
                    null;

                updateSummary();
            }
        );
    }
);

neutralButton.addEventListener(
    "click",
    () => {
        if (
            neutralConnected
        ) {
            return;
        }

        neutralConnected =
            true;

        showNeutralConnection();

        neutralButton.disabled =
            true;

        neutralButton.textContent =
            "NEUTRAL → ARMOUR CONNECTED";

        statusText.textContent =
            "Neutral connected to armour";

        updateSummary();
    }
);

resetButton.addEventListener(
    "click",
    () => {
        for (
            const visual
            of connectionVisuals
        ) {
            if (
                visual
            ) {
                anchor.group.remove(
                    visual
                );
            }
        }

        connectionVisuals.length =
            0;

        if (
            neutralVisual
        ) {
            anchor.group.remove(
                neutralVisual
            );

            neutralVisual =
                null;
        }

        assignments[0] = null;
        assignments[1] = null;
        assignments[2] = null;

        selectedResistor =
            null;

        neutralConnected =
            false;

        resistorButtons.forEach(
            button => {
                button.disabled =
                    false;

                button.classList.remove(
                    "selected",
                    "used"
                );
            }
        );

        neutralButton.disabled =
            false;

        neutralButton.textContent =
            "CONNECT NEUTRAL → ARMOUR";

        confirmButton.disabled =
            false;

        proceedButton.style.display =
            "none";

        updateSummary();

        statusText.textContent =
            "Connections reset";
    }
);

confirmButton.addEventListener(
    "click",
    () => {
        const completed =
            assignments.every(
                value =>
                    value !== null
            );

        if (
            !completed
        ) {
            statusText.textContent =
                "Connect all three phase cores";

            return;
        }

        if (
            !neutralConnected
        ) {
            statusText.textContent =
                "Connect Neutral to Armour";

            return;
        }

        const sessionData = {
            cableSet:
                cableSet,

            assignments: [
                assignments[0],
                assignments[1],
                assignments[2]
            ],

            neutralConnected:
                true,

            endACompleted:
                true,

            savedAt:
                Date.now()
        };

        localStorage.setItem(
            getStorageKey(
                cableSet
            ),
            JSON.stringify(
                sessionData
            )
        );

        confirmButton.disabled =
            true;

        proceedButton.style.display =
            "block";

        statusText.textContent =
            "✓ "
            +
            cableConfig.label
            +
            " END A COMPLETE";
    }
);

proceedButton.addEventListener(
    "click",
    () => {
        window.location.href =
            "./d05-end-b.html?set="
            +
            cableSet;
    }
);
</script>
</body>
</html>
